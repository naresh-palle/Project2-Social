name: cr8_mobile
description: flugr — influencer marketplace mobile client (Android + iOS). Shares the same backend APIs as the web app.
publish_to: "none"
version: 1.0.14+15

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  google_sign_in: ^6.2.2
  image_picker: ^1.1.2
  connectivity_plus: ^6.1.0
  google_fonts: ^6.3.2
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.16
  equatable: ^2.0.7
  collection: ^1.18.0
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  pull_to_refresh: ^2.0.0
  timeago: ^3.7.0
  uuid: ^4.5.1
  share_plus: ^12.0.2
  flutter_map: ^8.3.1
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/images/hero_models_bg.jpg
    - assets/images/flugr-logo.png
    - assets/images/flugr-mark.png
    - assets/images/flugr-avatar.png
