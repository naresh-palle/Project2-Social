name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/web/**"
      - ".github/workflows/deploy-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

# One Pages publisher at a time — avoids "in progress deployment" races
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build SPA for flugr.in
        working-directory: frontend
        env:
          CI: "false"
          PUBLIC_URL: /
        run: |
          npx craco build
          printf 'flugr.in\n' > build/CNAME

      # Repo Pages source is legacy branch `gh-pages` (not Actions artifact).
      # Only publish that branch — do NOT also call actions/deploy-pages, or
      # GitHub's pages-build-deployment races and fails with:
      # "in progress deployment… cancel … first".
      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/build
          # Replace prior SPA assets so stale hashed CSS/JS cannot linger
          keep_files: false
          force_orphan: false
          cname: flugr.in
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "Deploy website (light theme)"
